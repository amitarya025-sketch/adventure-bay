<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A bilingual English and Hindi learning game for kids aged 4 to 7.">
<meta name="theme-color" content="#1873b8">
<title>Adventure Bay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one sea-coloured world, a centred 980px play area, big white cards and chunky tap targets for small hands.
   Deliberately single-theme: a bright ocean look that stays the same in light and dark. */
:root {
  --sea-1: #a6e8fa;
  --sea-2: #4fbfe8;
  --sea-3: #1873b8;
  --ink: #08304d;
  --card: #ffffff;
  --coral: #ff8a7a;
  --sun: #ffd24d;
  --mint: #5fe0b4;
  --grape: #b9a2ff;
  --pink: #ff9ec4;
  --font: "Baloo 2", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif;
}
body {
  background-color: var(--sea-3);
  background-image: linear-gradient(180deg, var(--sea-1) 0%, var(--sea-2) 38%, var(--sea-3) 100%);
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.35;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.fx .bub { position: absolute; bottom: -40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: rgba(255,255,255,.18); animation: rise linear infinite; }
.fx .swim { position: absolute; font-size: 2.2rem; opacity: .55; animation: swim linear infinite; }
@keyframes rise { to { transform: translateY(-115vh); } }
@keyframes swim { from { transform: translateX(-12vw); } to { transform: translateX(112vw); } }

#app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: .01em; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; background: #fff; border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: transparent; color: var(--ink); font-weight: 700; font-size: 1rem; padding: 6px 14px; min-height: 44px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip, .chipbtn { background: #fff; color: var(--ink); border: 0; border-radius: 999px; padding: 6px 16px; min-height: 44px; font-weight: 800; font-size: 1rem; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn { cursor: pointer; }
.chipbtn:active { transform: scale(.97); }

.hero h1 { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 800; line-height: 1.1; margin: 8px 0 6px; text-wrap: balance; }
.hero p { margin: 0 0 20px; font-size: 1.2rem; font-weight: 500; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-height: 170px; padding: 20px 22px; background: var(--tone); color: var(--ink); border: 0; border-radius: 30px; box-shadow: 0 7px 0 rgba(8,48,77,.28); cursor: pointer; transition: transform .15s; }
.tile:hover { transform: translateY(-3px); }
.tile:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(8,48,77,.28); }
.ticon { font-size: 3.4rem; line-height: 1.1; }
.ttitle { font-size: 1.55rem; font-weight: 800; line-height: 1.1; }
.tsub { font-size: 1.05rem; font-weight: 500; }

.card { background: var(--card); border-radius: 30px; padding: 20px; box-shadow: 0 8px 0 rgba(8,48,77,.22); }
.qbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.qbar .chipbtn { background: #e8f8ff; }
.dots { display: flex; gap: 8px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: #cfe9f5; }
.dots i.done { background: var(--mint); }
.dots i.now { background: var(--sun); box-shadow: 0 0 0 3px var(--ink); }
.prompt { font-size: clamp(1.45rem, 4.8vw, 2.1rem); font-weight: 800; line-height: 1.15; margin: 10px 0; text-wrap: balance; }
.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 150px; margin-block: 12px 18px; padding: 16px; background: #e8f8ff; border-radius: 22px; }
.count-grid { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center; max-width: 640px; font-size: clamp(2.1rem, 8vw, 3.3rem); line-height: 1.1; }
.pic { font-size: clamp(4rem, 16vw, 6.5rem); line-height: 1; }
.word { font-size: 1.9rem; font-weight: 800; }
.story { font-size: 1.25rem; font-weight: 700; text-align: center; max-width: 34ch; text-wrap: balance; }
.seq { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.seq span { width: 1.5em; height: 1.5em; display: grid; place-items: center; font-size: clamp(2rem, 9vw, 3.2rem); background: #fff; border-radius: 18px; }
.seq .slot { background: transparent; border: 3px dashed var(--ink); font-weight: 800; }

.tank { position: relative; width: min(100%, 260px); height: 230px; background: #fff; border: 4px solid var(--ink); border-radius: 20px; overflow: hidden; }
.tank .water { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; background: linear-gradient(180deg, #6fd0f5, #37a8e0); }
.tank .thing { position: absolute; left: 50%; top: 6px; z-index: 2; font-size: 3rem; line-height: 1; transform: translateX(-50%); transition: transform 1.1s ease-in; }
.tank .thing.float { transform: translate(-50%, 56px); }
.tank .thing.sink { transform: translate(-50%, 150px); }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 14px; }
.opt { min-height: 104px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fff; color: var(--ink); border: 4px solid #bfe6f7; border-radius: 24px; font-size: clamp(2rem, 8vw, 3rem); font-weight: 800; line-height: 1.1; cursor: pointer; transition: transform .12s, background .2s; }
.opt:hover { transform: translateY(-2px); border-color: var(--sea-2); }
.opt:active { transform: scale(.97); }
.opt small { font-size: 1.05rem; font-weight: 700; }
.opt .em { font-size: 2.6rem; }
.opt .lb { font-size: 1.3rem; }
.opt.good { background: #b8f2d6; border-color: var(--mint); animation: pop .5s; }
.opt.oops { background: #ffe3df; border-color: #ffb3a8; opacity: .75; animation: shake .45s; }
.feedback { min-height: 2em; margin-top: 16px; text-align: center; font-size: 1.35rem; font-weight: 800; }

.end { text-align: center; padding-block: 28px; }
.end .trophy { font-size: 5rem; animation: bob 1.6s ease-in-out infinite; }
.end h2 { font-size: clamp(2rem, 7vw, 3rem); margin: 4px 0; }
.end .stars-row { font-size: 3rem; letter-spacing: .1em; margin: 10px 0; }
.end p { font-size: 1.2rem; margin: 6px 0; }
.end .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
.end .chipbtn { background: var(--sun); font-size: 1.25rem; padding: 10px 24px; min-height: 56px; }
.end .chipbtn.alt { background: #e8f8ff; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.mem { display: grid; gap: 10px; }
.mcard { aspect-ratio: 1; border: 0; border-radius: 18px; background: var(--sea-3); color: #fff; font-size: clamp(1.8rem, 8vw, 2.8rem); display: grid; place-items: center; cursor: pointer; box-shadow: 0 5px 0 rgba(8,48,77,.3); transition: transform .15s; }
.mcard:active { transform: scale(.96); }
.mcard .f { display: none; }
.mcard.up, .mcard.ok { background: #fff; color: var(--ink); }
.mcard.ok { background: #b8f2d6; }
.mcard.up .f, .mcard.ok .f { display: block; }
.mcard.up .b, .mcard.ok .b { display: none; }
.bubs { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 560px; }
.bubble { width: clamp(64px, 19vw, 88px); height: clamp(64px, 19vw, 88px); border-radius: 50%; border: 3px solid #fff; background: radial-gradient(circle at 30% 30%, #fff 0, #bdeaff 30%, #4fbfe8 100%); color: var(--ink); font-size: 1.9rem; font-weight: 800; cursor: pointer; transition: transform .25s, opacity .25s; animation: bob 2.4s ease-in-out infinite; }
.bubble:nth-child(even) { animation-delay: -1.1s; }
.bubble.popped { transform: scale(1.6); opacity: 0; pointer-events: none; }
.bubble.oops { animation: shake .45s; }
.grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 1.5rem; line-height: 1.15; }
.say { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 800; background: #fff; padding: 10px 24px; border-radius: 999px; }

.nlabel { display: block; margin-top: 8px; font-size: 1.4rem; font-weight: 800; }
.nameinput { display: block; width: min(100%, 360px); margin: 10px auto; padding: 12px 18px; min-height: 56px; font: inherit; font-size: 1.5rem; font-weight: 700; text-align: center; color: var(--ink); background: #e8f8ff; border: 4px solid var(--sea-2); border-radius: 999px; }
.nameinput:focus { outline: 4px solid var(--ink); outline-offset: 2px; }
.nneed { color: #b3261e; font-weight: 800; }
.chipbtn:disabled { opacity: .45; cursor: not-allowed; }

.diyas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 560px; }
.diya { position: relative; width: clamp(64px, 20vw, 90px); height: clamp(72px, 22vw, 100px); border: 0; border-radius: 22px; background: #fff; cursor: pointer; display: grid; place-items: end center; padding-bottom: 6px; box-shadow: 0 5px 0 rgba(8,48,77,.25); }
.diya:active { transform: scale(.96); }
.diya .lamp { font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: 1; }
.diya .fl { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: clamp(1.6rem, 6vw, 2.2rem); display: none; animation: bob 1s ease-in-out infinite; }
.diya.lit { background: #fff1b8; }
.diya.lit .fl { display: block; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

    S.locked = true; chime();
    if (S.first) { S.earned++; save.stars++; persist(); }
    if (fb) fb.textContent = '⭐ ' + w;
    speak(w);
    S.timer = setTimeout(function () {
      S.round++;
      if (S.round >= 5) { S.screen = 'end'; render(); fanfare(); } else nextQuestion();
    }, delay || 1700);
  }

  function flip(btn) {
    var m = S.mem;
    if (!m || S.locked || m.lock) return;
    var i = +btn.getAttribute('data-i');
    if (m.done[i] || m.open.indexOf(i) > -1) return;
    m.open.push(i); btn.classList.add('up'); tone(500 + i * 40, 0, .15, .12);
    if (m.open.length < 2) return;
    m.lock = true;
    var a = m.open[0], b = m.open[1];
    var ca = document.querySelector('[data-i="' + a + '"]'), cb = document.querySelector('[data-i="' + b + '"]');
    S.mt = setTimeout(function () {
      if (S.mem !== m) return;
      if (m.cards[a] === m.cards[b]) {
        m.done[a] = true; m.done[b] = true; ca.classList.add('ok'); cb.classList.add('ok'); m.matched++;
        tone(784, 0, .2, .15); tone(1047, .12, .25, .15);
        if (m.matched === m.cards.length / 2) roundWon(1700);
      } else {
        ca.classList.remove('up'); cb.classList.remove('up'); m.misses++; boop();
        if (m.misses > m.cards.length / 2) S.first = false;
      }
      m.open = []; m.lock = false;
    }, 800);
  }

  function pop(btn) {
    var b = S.bub;
    if (!b || S.locked) return;
    var n = +btn.getAttribute('data-n'), fb = document.getElementById('fb');
    if (n === b.next) {
      btn.classList.add('popped'); btn.disabled = true; tone(400 + n * 70, 0, .25, .15); b.next++;
      if (b.next > b.n) roundWon(1700);
    } else {
      S.first = false; boop(); btn.classList.remove('oops'); void btn.offsetWidth; btn.classList.add('oops');
      if (fb) fb.textContent = t('oops');
    }
  }

  function lightDiya(btn) {
    var d = S.diya;
    if (!d || S.locked) return;
    if (btn.classList.contains('lit')) { btn.classList.remove('lit'); d.lit--; tone(330, 0, .15, .1); return; }
    btn.classList.add('lit'); d.lit++; tone(500 + d.lit * 90, 0, .3, .15);
    if (d.lit === d.n) roundWon(1700);
  }

  function answer(btn) {
    if (S.locked) return;
    var k = btn.getAttribute('data-k'), o = S.q.options.filter(function (x) { return x.k === k; })[0];
    var fb = document.getElementById('fb');
    if (!o) return;
    if (o.ok) {
      btn.classList.add('good');
      if (S.q.onCorrect) S.q.onCorrect();
      roundWon(S.q.onCorrect ? 2000 : 1700);
    } else {
      S.first = false; boop();
      btn.classList.remove('oops'); void btn.offsetWidth; btn.classList.add('oops');
      if (fb) fb.textContent = t('oops');
    }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    audio();
    var act = el.getAttribute('data-act');
    if (act === 'lang') {
      var v = el.getAttribute('data-v'); if (v === save.lang) return;
      save.lang = v; persist();
      if (S.screen === 'game' && S.game) startGame(S.game.id); else render();
    } else if (act === 'sound') { save.sound = !save.sound; persist(); if (save.sound) { musicStart(); } else { musicStop(); try { window.speechSynthesis.cancel(); } catch (e) {} } render(); }
    else if (act === 'start') startGame(el.getAttribute('data-id'));
    else if (act === 'again') startGame(S.game.id);
    else if (act === 'next') startGame(GAMES[(GAMES.indexOf(S.game) + 1) % GAMES.length].id);
    else if (act === 'home') goHome();
    else if (act === 'speak') speak(S.q ? S.q.say : '', true);
    else if (act === 'answer') answer(el);
    else if (act === 'card') flip(el);
    else if (act === 'bub') pop(el);
    else if (act === 'diya') lightDiya(el);
    else if (act === 'begin') {
      var nm = save.name.trim();
      if (!nm) { var nn = document.getElementById('nneed'), ni = document.getElementById('nm'); if (nn) nn.hidden = false; if (ni) ni.focus(); return; }
      save.name = nm; persist(); S.screen = 'home'; render(); musicStart(); speak(t('helloN')(nm));
    }
  });

  app.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'nm') return;
    save.name = e.target.value.slice(0, 20);
    var go = document.getElementById('go'), nn = document.getElementById('nneed');
    if (go) go.disabled = !save.name.trim();
    if (nn && save.name.trim()) nn.hidden = true;
  });
  app.addEventListener('keydown', function (ev) {
    if (ev.target && ev.target.id === 'nm' && ev.key === 'Enter') { ev.preventDefault(); var go = document.getElementById('go'); if (go) go.click(); }
  });

  /* ---------- background bubbles and swimmers ---------- */
  (function () {
    var fx = document.getElementById('fx'), h = '', i;
    for (i = 0; i < 10; i++) {
      var s = 10 + rnd(26);
      h += '<span class="bub" style="left:' + rnd(100) + '%;width:' + s + 'px;height:' + s + 'px;animation-duration:' + (9 + rnd(10)) + 's;animation-delay:-' + rnd(14) + 's"></span>';
    }
    ['🐟', '🐬', '🐢'].forEach(function (e, n) {
      h += '<span class="swim" style="top:' + (18 + n * 24) + '%;animation-duration:' + (38 + n * 14) + 's;animation-delay:-' + (n * 13) + 's">' + e + '</span>';
    });
    fx.innerHTML = h;
  })();

  render();
})();
</script>
</body>
</html>
